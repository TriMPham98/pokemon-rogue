<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="red" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.55" stop-color="#e3262a"/>
      <stop offset="1" stop-color="#a3111a"/>
    </radialGradient>
    <radialGradient id="white" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#c3c8d2"/>
    </radialGradient>
    <radialGradient id="button" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde5"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="27"/></clipPath>
  </defs>
  <!-- Thick outline so it still reads at 16px. -->
  <circle cx="32" cy="32" r="29.5" fill="#15161c"/>
  <g clip-path="url(#ball)">
    <rect width="64" height="64" fill="url(#white)"/>
    <rect width="64" height="32" fill="url(#red)"/>
    <rect y="28" width="64" height="8" fill="#15161c"/>
    <!-- Glossy highlight on the top half. -->
    <ellipse cx="22" cy="15" rx="9" ry="5" fill="#fff" opacity="0.55" transform="rotate(-30 22 15)"/>
  </g>
  <circle cx="32" cy="32" r="10.5" fill="#15161c"/>
  <circle cx="32" cy="32" r="7" fill="url(#button)"/>
  <circle cx="32" cy="32" r="3.6" fill="none" stroke="#9aa1ae" stroke-width="1.4"/>
</svg>
